      # 1. Scarica il codice dal repository impostando i permessi di scrittura e la cronologia
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      # 2. Sincronizza l'ambiente con l'ultima versione del file presente su GitHub
      - name: Sincronizza modifiche precedenti
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true

      # 3. Esegui il tuo script Python (usa lo script aggiornato che ti ho fornito prima)
      - name: Esegui script meteo
        run: python script.py

      # 4. Salva e fai il push del file modificato preservando la cronologia
      - name: Commit e Push delle modifiche
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aggiornato diario meteo automatico [Append]"
          file_pattern: 'Dati_meteo.txt'
