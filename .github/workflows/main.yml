name: Aggiorna Meteo
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica temperature reali
        run: |
          ORA=$(TZ="Europe/Rome" date +"%d/%m/%Y %H:%M")
          echo "{\"ora\":\"$ORA\",\"dati\":[" > dati.json
          CITTA=(
            "L'Aquila|42.35|13.40" "Pescara|42.46|14.21" "Chieti|42.35|14.17"
            "Teramo|42.66|13.70" "Roccaraso|41.85|14.08" "Pescocostanzo|41.89|14.07"
            "Scanno|41.90|13.88" "Villetta Barrea|41.78|13.94" "Campo Imperatore|42.44|13.56"
            "Ovindoli|42.14|13.52" "Campo Felice|42.22|13.43" "Avezzano|42.03|13.43"
            "Sulmona|42.05|13.93" "Lanciano|42.23|14.39" "Vasto|42.11|14.71"
          )
          FIRST=1
          for item in "${CITTA[@]}"; do
            IFS="|" read -r NOME LAT LON <<< "$item"
            TEMP=$(curl -sS --max-time 8 "https://wttr.in" | tr -d '+°C ')
            if ! [[ "$TEMP" =~ ^-?[0-9]+(\.[0-9]+)?$ ]]; then
              TEMP=$(curl -sS --max-time 8 -A "Mozilla/5.0 (NeveInAbruzzo; +https://github.io)" "https://met.no" | tr ',' '\n' | grep '"air_temperature":' | head -n 1 | cut -d':' -f2 | tr -d '}')
            fi
            [ -z "$TEMP" ] && TEMP="null"
            [ $FIRST -eq 0 ] && echo "," >> dati.json
            FIRST=0
            echo "{\"nome\":\"$NOME\",\"temp\":$TEMP}" >> dati.json
          done
          echo "]}" >> dati.json
      - name: Salva dati.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dati.json
          git commit -m "Aggiornamento meteo" || exit 0
          git pull --rebase --autostash
          git push
