name: Automazione Dati Meteo
 
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  aggiorna-meteo:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa la libreria requests
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Esegui lo script meteo
      run: |
        python script.py

    - name: Pubblica i dati aggiornati su GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Meteo"
        git add Dati_meteo.txt
        # Eseguiamo il commit locale della modifica prima di qualsiasi operazione con il server remoto
        if ! git diff --cached --quiet; then
          git commit -m "Aggiornato diario meteo automatico"
          # Tiriamo su eventuali modifiche remote integrando il nostro commit in coda
          git pull --rebase origin main
          git push
        else
          echo "Nessuna modifica riscontrata nel file Dati_meteo.txt"
        fi
