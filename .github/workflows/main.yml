name: aggiorna-meteo

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *' # Esegue il workflow automaticamente ogni giorno alle 06:00 UTC

jobs:
  aggiorna-meteo:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          update-pip: false

      - name: Installa la libreria requests
        run: |
          pip install requests

      - name: Esegui lo script meteo
        run: |
          python script.py

      - name: Pubblica i dati aggiornati su GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Dati_meteo.txt
          git commit -m "Aggiornato diario meteo automatico" || echo "Nessuna modifica da caricare"
          git fetch origin
          git merge -X theirs origin/main -m "Risoluzione automatica conflitti"
          git push origin main
