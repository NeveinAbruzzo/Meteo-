name: Aggiorna Meteo
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica temperature reali
        run: |
          python3 - << 'EOF'
          import urllib.request, json, datetime
          citta = [
            ("L'Aquila",42.35,13.40),("Pescara",42.46,14.21),("Chieti",42.35,14.17),
            ("Teramo",42.66,13.70),("Roccaraso",41.85,14.08),("Pescocostanzo",41.89,14.07),
            ("Scanno",41.90,13.88),("Villetta Barrea",41.78,13.94),("Campo Imperatore",42.44,13.56),
            ("Ovindoli",42.14,13.52),("Campo Felice",42.22,13.43),("Avezzano",42.03,13.43),
            ("Sulmona",42.05,13.93),("Lanciano",42.23,14.39),("Vasto",42.11,14.71)
          ]
          out = []
          headers = {"User-Agent": "NeveInAbruzzo/1.0 ://github.com"}
          for nome, lat, lon in citta:
            url = f"https://met.no{lat}&lon={lon}"
            req = urllib.request.Request(url, headers=headers)
            res = urllib.request.urlopen(req, timeout=15)
            data = json.loads(res.read().decode())
            primo = next(iter(data["properties"]["timeseries"]))
            temp = primo["data"]["instant"]["details"]["air_temperature"]
            out.append({"nome": nome, "temp": temp})
          ora = (datetime.datetime.utcnow() + datetime.timedelta(hours=1)).strftime("%d/%m/%Y %H:%M")
          with open("dati.json", "w", encoding="utf-8") as f:
            json.dump({"ora": ora, "dati": out}, f, ensure_ascii=False)
          EOF
      - name: Salva dati.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add dati.json
          git commit -m "Aggiornamento meteo" || exit 0
          git push
