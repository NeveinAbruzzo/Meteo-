name: Genera Post Meteo Automatico
import requests

# Sostituisci con il tuo URL effettivo
url = "https://esempio.com" 

response = requests.get(url)

# 1. Verifica che non ci siano errori HTTP (es. 404, 500)
response.raise_for_status() 

try:
    # 2. Prova a decodificare il JSON
    dati = response.json() 
except requests.exceptions.JSONDecodeError:
    # 3. Se fallisce, stampa cosa ha risposto davvero il server per capire il problema
    print("Il server non ha restituito un JSON valido!")
    print("Contenuto ricevuto:", response.text)
    raise

    
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: 

jobs:
  crea-articolo:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa librerie
        run: pip install requests

      - name: Scarica Meteo e Scrivi File
        run: |
          python - <<EOF
          import requests
          from datetime import datetime

          # Questo è il link corretto che contiene le API tecniche per estrarre i dati
          url_meteo = "https://open-meteo.com"
          meteo = requests.get(url_meteo).json()
          
          temp = meteo['current']['temperature_2m']
          umidita = meteo['current']['relative_humidity_2m']

          data_oggi = datetime.now().strftime("%Y-%m-%d")

          testo_articolo = f"""# Meteo del {data_oggi}

          Buongiorno! Questo articolo è stato generato automaticamente dai server di GitHub.

          ### 📊 Dati Rilevati:
          * **Temperatura attuale:** {temp} °C
          * **Umidità:** {umidita} %

          *Aggiornato automaticamente grazie a GitHub Actions.*
          """

          nome_file = f"posts/meteo-{data_oggi}.md"
          with open(nome_file, "w", encoding="utf-8") as f:
              f.write(testo_articolo)
              
          print(f"File {nome_file} creato con successo!")
          EOF

      - name: Salva il post nel repository
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add posts/*.md
          git commit -m "Aggiunto post meteo automatico" || exit 0
          git push
