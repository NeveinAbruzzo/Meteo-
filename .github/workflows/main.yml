name: Automazione Dati Meteo
 
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-meteo:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa la libreria requests
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Esegui lo script meteo
      run: |
        # Eseguiamo il codice direttamente inline senza caricare file esterni
        python -c '
        import os, time, requests
        from datetime import datetime

        localita = ["Roccaraso", "Castel di Sangro", "Rivisondoli"]
        orario = datetime.now().strftime("%d/%m/%Y %H:%M")
        righe = []

        print(f"--- INIZIO EXTRAZIONE DATI ({orario}) ---")

        for i, c in enumerate(localita):
            c_formattata = c.replace(" ", "+")
            url = f"https://wttr.in{c_formattata}?format=j1"
            try:
                print(f"Interrogazione API wttr.in per {c}...")
                response = requests.get(url, timeout=12)
                if response.status_code == 200:
                    dati = response.json()
                    temp = dati["current_condition"][0]["temp_C"]
                    riga = f"[{orario}] {c}: {temp}°C\n"
                    righe.append(riga)
                    print(f"-> OK: {riga.strip()}")
                else:
                    print(f"-> Server ko ({response.status_code}) per {c}")
            except Exception as e:
                print(f"-> Errore con {c}: {e}")
            
            if i < len(localita) - 1:
                time.sleep(2)

        if righe:
            with open("Dati_meteo.txt", "a", encoding="utf-8") as f:
                f.writelines(righe)
            print("Scrittura completata con successo su Dati_meteo.txt.")
        '

    - name: Pubblica i dati aggiornati su GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Meteo"
        git add Dati_meteo.txt
        git commit -m "Aggiornato diario meteo comprensorio" || echo "Nessuna modifica da salvare"
        git push origin main
