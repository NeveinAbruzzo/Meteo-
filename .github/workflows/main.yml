name: Automazione Dati Meteo

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *' # Controlla i dati in automatico ogni ora

jobs:
  aggiorna-meteo:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa la libreria requests
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Esegui lo script meteo
      run: python script.py

    - name: Pubblica i dati aggiornati su GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Meteo"
        git add diario_meteo.txt
        git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiornato diario meteo automatico" && git push)

