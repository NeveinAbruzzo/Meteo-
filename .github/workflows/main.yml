name: Automazione Dati Meteo
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  aggiorna-meteo:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa la libreria requests
      run: pip install requests

    - name: Esegui lo script meteo
      run: python script.py

    - name: Pubblica i dati aggiornati su GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Meteo"
        git add Dati_meteo.txt
        git commit -m "Aggiornato diario meteo automatico [skip ci]" || echo "Nessuna modifica"
        
        # RISOLUZIONE DEL CONFLITTO: Forziamo Git a dare la precedenza totale alla sovrascrittura di Python
        git pull --rebase -X theirs origin main
        git push origin main
