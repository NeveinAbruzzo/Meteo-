name: Automazione Dati Meteo
 
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-meteo:
    runs-on: ubuntu-latest

    steps:
    - name: Scarica il repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa requests
      run: pip install requests

    - name: Esegui lo script meteo
      run: python script.py

    - name: Pubblica i dati aggiornati su GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Meteo"
        git add Dati_meteo.txt
        git commit -m "Meteo aggiornato" || echo "No changes"
        git push origin main
