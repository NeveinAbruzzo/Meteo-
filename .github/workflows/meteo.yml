name: run-blogger-sync 

on:
  # Esegue lo script ogni giorno alle 07:30 UTC (08:30 in Italia)
  schedule:
    - cron: '30 7 * * *'
  # Ti permette di avviarlo manualmente quando vuoi per fare i test
  workflow_dispatch:

jobs:
  run-blogger-sync:
    runs-on: ubuntu-latest

    steps:
    - name: Controlla il codice del repository
      uses: actions/checkout@v4

    - name: Configura l'ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa le librerie per Google e le richieste HTTP
      run: |
        python -m pip install --upgrade pip
        pip install requests PyJWT cryptography

    - name: Esegui lo script di pubblicazione
      run: |
        python meteo_blogger.py
