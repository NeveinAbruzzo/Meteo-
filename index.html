<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo Station</title>
    <style>
        /* Questo è il CSS, serve a definire i colori, la disposizione e i font */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .weather-container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .location {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .main-weather {
            margin-bottom: 2rem;
        }

        .temperature {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .description {
            font-size: 1.2rem;
            color: #e2e8f0;
            text-transform: capitalize;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1.5rem;
        }

        .detail-card {
            background: rgba(15, 23, 42, 0.5);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }

        .detail-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f5f9;
        }
    </style>
</head>
<body>

    <div class="weather-container">
        <h1>Stazione Meteo</h1>
        <div class="location">Rilevamento Automatico</div>

        <div class="main-weather">
            <!-- Questi dati sono provvisori, poi vedremo come collegarli ai tuoi script -->
            <div class="temperature">18°C</div>
            <div class="description">Nuvoloso</div>
        </div>

        <div class="details-grid">
            <div class="detail-card">
                <div class="detail-label">Umidità</div>
                <div class="detail-value">72%</div>
            </div>
            <div class="detail-card">
                <div class="detail-label">Vento</div>
                <div class="detail-value">14 km/h</div>
            </div>
        </div>
    </div>

</body>
</html>
